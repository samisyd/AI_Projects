<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG + Redis Semantic Cache</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f9fafb;
            color: #111827;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2 { margin-top: 0; color: #1f2937; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 12px;
            font-size: 16px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        button:hover { background: #1d4ed8; }
        .clear-btn { background: #ef4444; margin-left: 8px; }
        .clear-btn:hover { background: #dc2626; }
        .result-box {
            background: #f3f4f6;
            padding: 16px;
            border-radius: 6px;
            margin-top: 16px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            background: #e0e7ff;
            color: #3730a3;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚡ RAG + Redis Semantic Cache Explorer</h2>
        <p>Ask a question about your documents. Try asking the same question phrased differently to watch the latency drop via Redis caching!</p>
        <input type="text" id="queryInput" placeholder="e.g., What is Influenza? or Tell me about flu" />
        <div>
            <button onclick="sendQuery()">Submit Query</button>
            <button class="clear-btn" onclick="clearCache()">Clear Cache</button>
        </div>
        <div id="output" style="display:none;" class="result-box"></div>
    </div>

    <script>
        async function sendQuery() {
            const question = document.getElementById('queryInput').value;
            const output = document.getElementById('output');
            if (!question) return;

            output.style.display = 'block';
            output.innerText = 'Searching vector store & LLM...';

            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });
                const data = await response.json();
                output.innerHTML = `<strong>Response:</strong>\n${data.answer}\n\n<span class="badge">⏱️ Execution Time: ${data.execution_time_seconds}s</span>`;
            } catch (err) {
                output.innerText = 'Error processing request.';
            }
        }

        async function clearCache() {
            const output = document.getElementById('output');
            output.style.display = 'block';
            const res = await fetch('/api/cache/clear', { method: 'DELETE' });
            const data = await res.json();
            output.innerText = data.message;
        }
    </script>
</body>
</html>
